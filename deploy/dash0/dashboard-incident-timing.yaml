# Measured instruments only. Release-separated series avoid mixing histogram bucket configurations.
# Missing samples remain no data; no synthetic zero/health fallback. See metrics.md.
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: backstage-incident-evidence
  namespace: team-backstage
spec:
  duration: 1h
  display:
    name: Backstage measured API and evidence
  layouts:
  - kind: Grid
    spec:
      items:
      - x: 0
        y: 0
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/http_requests'
      - x: 12
        y: 0
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/http_errors'
      - x: 0
        y: 8
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/http_duration'
      - x: 12
        y: 8
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/es_duration'
      - x: 0
        y: 16
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/persistence_errors'
      - x: 12
        y: 16
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/search_duration'
      - x: 0
        y: 24
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/projection_lag'
      - x: 12
        y: 24
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/projection_duration'
      - x: 0
        y: 32
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/documents'
  panels:
    http_requests:
      kind: Panel
      spec:
        display:
          name: HTTP requests / second by route
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (service_version,method,route) (rate({otel_metric_name="backstage.http.requests",service_name="incident-api"}[5m]))
    http_errors:
      kind: Panel
      spec:
        display:
          name: HTTP 4xx / 5xx responses / second
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (service_version,status_code) (rate({otel_metric_name="backstage.http.requests",service_name="incident-api",status_code=~"[45].."}[5m]))
    http_duration:
      kind: Panel
      spec:
        display:
          name: HTTP p95 duration (seconds)
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: histogram_quantile(0.95, sum by (service_version,method,route) (rate({otel_metric_name="backstage.http.request.duration",service_name="incident-api"}[5m])))
    es_duration:
      kind: Panel
      spec:
        display:
          name: Elasticsearch p95 duration (seconds)
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: histogram_quantile(0.95, sum by (service_version,operation,outcome) (rate({otel_metric_name="backstage.elasticsearch.request.duration",service_name="incident-api"}[5m])))
    persistence_errors:
      kind: Panel
      spec:
        display:
          name: Persistence errors / second by operation
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (service_version,operation) (rate({otel_metric_name="backstage.persistence.operations",service_name="incident-api",outcome="error"}[5m]))
    search_duration:
      kind: Panel
      spec:
        display:
          name: Evidence search p95 duration (seconds)
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: histogram_quantile(0.95, sum by (service_version,outcome) (rate({otel_metric_name="backstage.evidence.search.duration",service_name="incident-api"}[5m])))
    projection_lag:
      kind: Panel
      spec:
        display:
          name: Evidence projection lag (committed revisions)
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: max by (service_version) ({otel_metric_name="backstage.evidence.projection.lag",service_name="incident-api"})
    projection_duration:
      kind: Panel
      spec:
        display:
          name: Evidence projection p95 duration (seconds)
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: histogram_quantile(0.95, sum by (service_version,outcome) (rate({otel_metric_name="backstage.evidence.projection.duration",service_name="incident-api"}[5m])))
    documents:
      kind: Panel
      spec:
        display:
          name: Evidence documents / second by kind and outcome
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (service_version,kind,outcome) (rate({otel_metric_name="backstage.evidence.documents",service_name="incident-api"}[5m]))
