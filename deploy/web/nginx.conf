# web: static board and stage page, same-origin API and browser OTLP.
# Upstream names resolve at startup, so the incident-api and otel-collector Services must exist first.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "microphone=(self), camera=(self)" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/ {
        proxy_pass http://incident-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # Only the briefing route checks incident-API authentication. Keep other OpenAI routes private.
    location = /openai/briefing/token {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_read_timeout 30s;
        client_max_body_size 16k;
        add_header Cache-Control "no-store" always;
    }

    location /openai { return 404; }

    location = /presence {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /presence/join {
        limit_except POST DELETE { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 1k;
    }

    location /presence/ { return 404; }

    # Laptop inference is not automatically exposed by the public deployment.
    location /camera/ { return 503; }

    location = /v1/traces {
        limit_except POST {
            deny all;
        }
        proxy_pass http://otel-collector:4318;
        proxy_http_version 1.1;
        proxy_set_header Host otel-collector;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        client_max_body_size 2m;
    }

    location = /stage {
        return 302 /stage.html;
    }

    location = /stage.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "microphone=(self), camera=(self)" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "microphone=(self), camera=(self)" always;
        try_files $uri $uri/ /index.html;
    }
}
