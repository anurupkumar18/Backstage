# Local otel-collector without a Dash0 token: same receivers and processors, debug exporter to stdout.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 2097152
        read_timeout: 5s
        write_timeout: 5s
        cors:
          allowed_origins:
            - ${env:OTEL_CORS_ALLOWED_ORIGIN:-http://localhost:5173}
          allowed_headers:
            - content-type
          max_age: 600

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.idempotency-key
        action: delete
  batch:
    send_batch_size: 512
    send_batch_max_size: 512
    timeout: 2s

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [debug]
