# otel-collector: OTLP in on 4317 (gRPC) and 4318 (HTTP), Dash0 out over OTLP/gRPC.
# Env: DASH0_OTLP_ENDPOINT (host:port from Dash0 onboarding), DASH0_AUTH_TOKEN, DASH0_DATASET,
# OTEL_CORS_ALLOWED_ORIGIN (the web origin that posts browser spans to /v1/traces).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 2097152
        read_timeout: 5s
        write_timeout: 5s
        cors:
          allowed_origins:
            - ${env:OTEL_CORS_ALLOWED_ORIGIN:-http://localhost:5173}
          allowed_headers:
            - content-type
          max_age: 600

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.idempotency-key
        action: delete
  batch:
    send_batch_size: 512
    send_batch_max_size: 512
    timeout: 2s

exporters:
  otlp/dash0:
    endpoint: ${env:DASH0_OTLP_ENDPOINT}
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 256
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
    headers:
      Authorization: Bearer ${env:DASH0_AUTH_TOKEN}
      Dash0-Dataset: ${env:DASH0_DATASET:-default}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/dash0]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/dash0]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/dash0]
