limit_req_zone $binary_remote_addr zone=browser_telemetry:1m rate=10r/s;

# web: static board and stage page, same-origin API and browser OTLP.
# Upstream names resolve at startup, so the incident-api and otel-collector Services must exist first.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v1/ {
        # Evidence search terms and credentials must not enter URL access logs.
        access_log off;
        proxy_pass http://incident-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # Same-origin SDK-Web OTLP/JSON traces + logs. Never forward caller credentials.
    # One shared per-client budget for both ingest routes; telemetry failure stays isolated.
    location ~ ^/(?:otel/)?v1/(traces|logs)$ {
        # SDK excludes its transport URL prefix; /otel preserves same-origin API RUM.
        rewrite ^/otel(/v1/(?:traces|logs))$ $1 break;
        limit_except POST { deny all; }
        limit_req zone=browser_telemetry burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://otel-collector:4318;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host otel-collector;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        client_body_timeout 5s;
        client_max_body_size 2m;
        access_log off;
    }

    location = /stage {
        return 302 /stage.html;
    }

    location = /stage.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "microphone=(self), camera=()" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "microphone=(self), camera=()" always;
        try_files $uri $uri/ /index.html;
    }
}
