# Example only. Not listed in kustomization.yaml. Create the real Secret out of band:
#   kubectl -n <namespace> create secret generic dash0-credentials \
#     --from-literal=DASH0_OTLP_ENDPOINT=<host:4317 from Dash0 onboarding> \
#     --from-literal=DASH0_AUTH_TOKEN=<token> --from-literal=DASH0_DATASET=default
apiVersion: v1
kind: Secret
metadata:
  name: dash0-credentials
type: Opaque
stringData:
  DASH0_OTLP_ENDPOINT: REPLACE_WITH_DASH0_INGRESS_HOST:4317
  DASH0_AUTH_TOKEN: REPLACE_WITH_DASH0_AUTH_TOKEN
  DASH0_DATASET: default
