# Staged Station A outage drill, run inside the cluster. Not part of the kustomization.
#
#   kubectl -n team-backstage scale deployment/badge-station-a --replicas=0
#   kubectl -n team-backstage wait --for=delete pod -l app.kubernetes.io/name=badge-station-a --timeout=60s
#   kubectl -n team-backstage delete job badge-drill --ignore-not-found
#   kubectl -n team-backstage apply -f deploy/badge/drill-job.yaml
#   kubectl -n team-backstage logs -f job/badge-drill          # ends with DRILL PASSED
#   kubectl -n team-backstage scale deployment/badge-station-a --replicas=1
#
# Station A must be fully gone before the drill seeds, or A prints the jobs itself.
apiVersion: batch/v1
kind: Job
metadata:
  name: badge-drill
  labels:
    app.kubernetes.io/part-of: backstage
    app.kubernetes.io/component: badge-drill
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: badge-drill
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: drill
          image: public.ecr.aws/docker/library/python:3.13-slim
          envFrom:
            - secretRef:
                name: badge-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          command:
            - python
            - -u
            - -c
            - |
              import json, os, time, urllib.request, urllib.error
              BASE = os.environ.get("BADGE_CONTROL_URL", "http://badge-control:8090")
              TOKEN = os.environ["BADGE_INTERNAL_TOKEN"]
              JOBS = ["badge-job-001", "badge-job-002", "badge-job-003"]
              INCIDENT = "inc-badge_stall-room-c"
              def call(method, path, body=None, headers=None):
                  h = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json", **(headers or {})}
                  req = urllib.request.Request(BASE + path, method=method, headers=h,
                                               data=json.dumps(body).encode() if body is not None else None)
                  try:
                      with urllib.request.urlopen(req, timeout=10) as r:
                          return r.status, json.load(r)
                  except urllib.error.HTTPError as e:
                      return e.code, json.load(e)
              def log(step, payload):
                  print(f"[{time.strftime('%H:%M:%S')}] {step}: {json.dumps(payload)}")
              def wait(label, predicate, seconds):
                  deadline = time.time() + seconds
                  while time.time() < deadline:
                      state = call("GET", "/admin/state")[1]
                      if predicate(state):
                          log(label, state["stations"])
                          return state
                      time.sleep(1)
                  raise SystemExit(f"timed out waiting for: {label}")
              call("POST", "/admin/reset")
              # Reset clears heartbeats, so wait for B to heartbeat again while A stays silent.
              wait("station-b online, station-a silent",
                   lambda s: s["stations"]["station-b"]["online"] and not s["stations"]["station-a"]["online"], 30)
              log("seed", [j["job_id"] + "@" + j["station_id"] for j in call("POST", "/admin/seed", {"station_id": "station-a"})[1]["jobs"]])
              time.sleep(6)  # longer than BADGE_HEARTBEAT_TIMEOUT
              state = call("GET", "/admin/state")[1]
              pending_a = [j["job_id"] for j in state["jobs"] if j["station_id"] == "station-a" and j["status"] == "pending"]
              log("stuck at station-a", pending_a)
              if pending_a != JOBS:
                  raise SystemExit("jobs did not stall at station-a; is badge-station-a scaled to 0?")
              status, diag = call("POST", "/internal/radar/diagnose", {"incident_id": INCIDENT, "station_id": "station-a"})
              log(f"diagnose {status}", diag)
              body = {"incident_id": INCIDENT, "from_station_id": "station-a", "to_station_id": "station-b", "job_ids": JOBS}
              key = {"Idempotency-Key": f"drill-{int(time.time())}"}
              status, first = call("POST", "/internal/badges/reroute", body, key)
              log(f"reroute {status}", first)
              status2, again = call("POST", "/internal/badges/reroute", body, key)
              log(f"reroute replay {status2} same={again == first}", again)
              deadline = time.time() + 60
              while time.time() < deadline:
                  jobs = [call("GET", f"/internal/badges/jobs/{j}")[1] for j in JOBS]
                  if all(j["status"] == "complete" for j in jobs):
                      break
                  time.sleep(1)
              for job in jobs:
                  log("job", job)
              ok = (status == 202 and again == first and
                    all(j["status"] == "complete" and j["station_id"] == "station-b" and j["pdf_ref"] == "pdf-" + j["job_id"] for j in jobs))
              print("DRILL PASSED" if ok else "DRILL FAILED")
              raise SystemExit(0 if ok else 1)
